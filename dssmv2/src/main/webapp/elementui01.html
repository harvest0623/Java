<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理</title>
    <link rel="stylesheet" href="css/font-awesome.min.css"/>
    <script src="js/vue3.js"></script>
    <script src="js/qs.min.js"></script>
    <script src="js/axios.min.js"></script>
    <link rel="stylesheet" href="js/index.css">
    <script src="js/index.full.js"></script>
    <script src="js/index.iife.min.js"></script>
    <script src="js/zh-cn.js"></script>
    <style>
        /* 字体规范: 11px(提示) 12px(正文) 13px(按钮) 14px(小标题) 16px(大标题) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            font-size: 12px; background: #f0f2f5;
        }
        #app { padding: 14px; min-height: 100%; }

        /* 头部 */
        .page-head {
            background: #fff; padding: 14px 18px;
            border-radius: 6px; margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .page-title { font-size: 14px; color: #303133; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .page-title i { color: #1890ff; }
        .page-desc { font-size: 12px; color: #909399; margin-top: 4px; }

        /* 统计卡片 */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
        .stat {
            background: #fff; padding: 14px; border-radius: 6px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .stat-ico {
            width: 40px; height: 40px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: #fff;
        }
        .stat-ico.c1 { background: linear-gradient(135deg, #1890ff, #096dd9); }
        .stat-ico.c2 { background: linear-gradient(135deg, #52c41a, #389e0d); }
        .stat-ico.c3 { background: linear-gradient(135deg, #eb2f96, #c41d7f); }
        .stat-ico.c4 { background: linear-gradient(135deg, #fa8c16, #d46b08); }
        .stat-num { font-size: 16px; font-weight: 600; color: #303133; }
        .stat-lbl { font-size: 11px; color: #909399; margin-top: 2px; }

        /* 工具栏 */
        .toolbar {
            background: #fff; padding: 10px 14px; border-radius: 6px;
            margin-bottom: 10px; display: flex; align-items: center;
            justify-content: space-between; flex-wrap: wrap; gap: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .tb-left { display: flex; align-items: center; gap: 10px; }
        .tb-right { display: flex; align-items: center; gap: 8px; }

        .sinput { position: relative; display: flex; align-items: center; }
        .sinput input {
            width: 200px; height: 32px; padding: 0 10px 0 30px;
            border: 1px solid #d9d9d9; border-radius: 4px; font-size: 12px;
            outline: none; background: #fafafa; transition: all 0.2s;
        }
        .sinput input:focus { border-color: #1890ff; background: #fff; }
        .sinput i { position: absolute; left: 10px; font-size: 12px; color: #bfbfbf; }

        .btn {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 6px 12px; border-radius: 4px; font-size: 12px;
            font-weight: 500; cursor: pointer; transition: all 0.2s;
            border: 1px solid transparent;
        }
        .btn-primary { background: #1890ff; color: #fff; }
        .btn-primary:hover { background: #096dd9; }
        .btn-default { background: #fff; color: #606266; border-color: #d9d9d9; }
        .btn-default:hover { color: #1890ff; border-color: #1890ff; }
        .btn-warn { background: #fff; color: #fa8c16; border-color: #ffd591; }
        .btn-warn:hover { background: #fa8c16; color: #fff; border-color: #fa8c16; }
        .btn-danger { background: #fff; color: #f5222d; border-color: #ffa39e; }
        .btn-danger:hover { background: #f5222d; color: #fff; border-color: #f5222d; }
        .btn-sm { padding: 4px 8px; font-size: 12px; }

        /* 表格 */
        .table-wrap {
            background: #fff; border-radius: 6px; overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        thead { background: #fafafa; }
        th {
            padding: 10px 12px; text-align: left; font-weight: 600;
            color: #606266; border-bottom: 1px solid #e8e8e8; font-size: 12px;
        }
        td {
            padding: 10px 12px; color: #606266;
            border-bottom: 1px solid #f0f0f0;
        }
        tbody tr:hover { background: #fafafa; }
        tbody tr:last-child td { border-bottom: none; }

        .tag {
            display: inline-block; padding: 1px 8px;
            border-radius: 10px; font-size: 11px; font-weight: 500;
        }
        .tag-blue { background: #e6f7ff; color: #1890ff; }
        .tag-pink { background: #fff0f6; color: #eb2f96; }

        .actions { display: flex; gap: 6px; }

        /* 分页 */
        .pager { padding: 12px 16px; display: flex; justify-content: flex-end; }

        /* 对话框样式 */
        .el-dialog { border-radius: 8px !important; }
        .el-dialog__header { padding: 14px 20px !important; margin-right: 0 !important; background: #fafafa; border-bottom: 1px solid #f0f0f0; }
        .el-dialog__title { font-size: 14px !important; font-weight: 600 !important; color: #303133; }
        .el-dialog__body { padding: 20px !important; }
        .el-dialog__footer { padding: 12px 20px !important; text-align: right; }
        .el-form-item__label { font-size: 12px !important; color: #606266 !important; }
        .el-input__inner { font-size: 12px !important; }

        /* 空状态 */
        .empty { text-align: center; padding: 40px 20px; color: #bfbfbf; }
        .empty i { font-size: 36px; margin-bottom: 10px; }
        .empty p { font-size: 12px; }

        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .toolbar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="page-head">
        <div class="page-title"><i class="fa fa-user-circle"></i>员工管理</div>
        <div class="page-desc">管理员工基本信息，支持新增、编辑、删除和查询</div>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-ico c1"><i class="fa fa-users"></i></div>
            <div>
                <div class="stat-num">{{ total }}</div>
                <div class="stat-lbl">员工总数</div>
            </div>
        </div>
        <div class="stat">
            <div class="stat-ico c2"><i class="fa fa-mars"></i></div>
            <div>
                <div class="stat-num">{{ maleCount }}</div>
                <div class="stat-lbl">当前页男性</div>
            </div>
        </div>
        <div class="stat">
            <div class="stat-ico c3"><i class="fa fa-venus"></i></div>
            <div>
                <div class="stat-num">{{ femaleCount }}</div>
                <div class="stat-lbl">当前页女性</div>
            </div>
        </div>
        <div class="stat">
            <div class="stat-ico c4"><i class="fa fa-file-text"></i></div>
            <div>
                <div class="stat-num">{{ currentPage }}/{{ totalPages }}</div>
                <div class="stat-lbl">当前页/总页</div>
            </div>
        </div>
    </div>

    <div class="toolbar">
        <div class="tb-left">
            <div class="sinput">
                <i class="fa fa-search"></i>
                <input type="text" v-model="searchKey" placeholder="搜索员工姓名">
            </div>
            <button class="btn btn-default btn-sm" @click="searchKey=''">
                <i class="fa fa-refresh"></i>重置
            </button>
        </div>
        <div class="tb-right">
            <button class="btn btn-primary btn-sm" @click="addDialogVisible = true">
                <i class="fa fa-plus"></i>新增员工
            </button>
            <button class="btn btn-danger btn-sm" @click="quit">
                <i class="fa fa-sign-out"></i>退出
            </button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th width="70">编号</th>
                <th>姓名</th>
                <th width="70">年龄</th>
                <th width="70">性别</th>
                <th>地址</th>
                <th width="120">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr v-for="row in filteredData" :key="row.id">
                <td>{{ row.id }}</td>
                <td style="font-weight:500;color:#303133;">{{ row.name }}</td>
                <td>{{ row.age }}</td>
                <td>
                        <span class="tag" :class="row.sex == 0 ? 'tag-blue' : 'tag-pink'">
                            {{ row.sex == 0 ? '男' : '女' }}
                        </span>
                </td>
                <td>{{ row.address }}</td>
                <td>
                    <div class="actions">
                        <button class="btn btn-warn btn-sm" @click="edit(row)">
                            <i class="fa fa-edit"></i>编辑
                        </button>
                        <button class="btn btn-danger btn-sm" @click="del(row.id)">
                            <i class="fa fa-trash"></i>删除
                        </button>
                    </div>
                </td>
            </tr>
            <tr v-if="filteredData.length === 0">
                <td colspan="6">
                    <div class="empty">
                        <i class="fa fa-inbox"></i>
                        <p>暂无员工数据</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="pager">
            <el-pagination
                    @size-change="handleSizeChange"
                    @current-change="handleCurrentChange"
                    :current-page="currentPage"
                    :page-sizes="[5, 10, 20]"
                    :page-size="pageSize"
                    layout="total, sizes, prev, pager, next, jumper"
                    :total="total"
                    background>
            </el-pagination>
        </div>
    </div>

    <!-- 添加 -->
    <el-dialog v-model="addDialogVisible" width="420px" :close-on-click-modal="false">
        <template #header><i class="fa fa-user-plus" style="margin-right:6px;color:#1890ff;"></i>新增员工</template>
        <el-form :model="addform" :rules="rules" ref="addForm" label-width="60px">
            <el-form-item label="姓名" prop="name">
                <el-input v-model="addform.name" placeholder="请输入姓名" size="default"></el-input>
            </el-form-item>
            <el-form-item label="年龄" prop="age">
                <el-input v-model.number="addform.age" placeholder="请输入年龄" size="default"></el-input>
            </el-form-item>
            <el-form-item label="性别">
                <el-radio-group v-model="addform.sex">
                    <el-radio :label="0">男</el-radio>
                    <el-radio :label="1">女</el-radio>
                </el-radio-group>
            </el-form-item>
            <el-form-item label="地址" prop="address">
                <el-input v-model="addform.address" placeholder="请输入地址" size="default"></el-input>
            </el-form-item>
        </el-form>
        <template #footer>
            <el-button @click="addDialogVisible=false" size="default">取消</el-button>
            <el-button type="primary" @click="doAdd" size="default">确定</el-button>
        </template>
    </el-dialog>

    <!-- 编辑 -->
    <el-dialog v-model="editDialogVisible" width="420px" :close-on-click-modal="false">
        <template #header><i class="fa fa-edit" style="margin-right:6px;color:#fa8c16;"></i>编辑员工</template>
        <el-form :model="editform" :rules="rules" ref="editForm" label-width="60px">
            <el-form-item label="姓名" prop="name">
                <el-input v-model="editform.name" placeholder="请输入姓名" size="default"></el-input>
            </el-form-item>
            <el-form-item label="年龄" prop="age">
                <el-input v-model.number="editform.age" placeholder="请输入年龄" size="default"></el-input>
            </el-form-item>
            <el-form-item label="性别">
                <el-radio-group v-model="editform.sex">
                    <el-radio :label="0">男</el-radio>
                    <el-radio :label="1">女</el-radio>
                </el-radio-group>
            </el-form-item>
            <el-form-item label="地址" prop="address">
                <el-input v-model="editform.address" placeholder="请输入地址" size="default"></el-input>
            </el-form-item>
        </el-form>
        <template #footer>
            <el-button @click="editDialogVisible=false" size="default">取消</el-button>
            <el-button type="primary" @click="doEdit" size="default">确定</el-button>
        </template>
    </el-dialog>
</div>

<script>
    const app = Vue.createApp({
        data() {
            return {
                currentPage: 1, pageSize: 5, total: 0,
                tableData: [], searchKey: '',
                addDialogVisible: false, editDialogVisible: false,
                addform: { sex: 0 }, editform: {},
                rules: {
                    name: [{ required: true, message: '请输入姓名', trigger: 'blur' }],
                    age: [{ required: true, message: '请输入年龄', trigger: 'blur' }],
                    address: [{ required: true, message: '请输入地址', trigger: 'blur' }]
                }
            }
        },
        computed: {
            filteredData() {
                if (!this.searchKey) return this.tableData;
                var key = this.searchKey.toLowerCase();
                return this.tableData.filter(function(item) {
                    return item.name && item.name.toLowerCase().indexOf(key) >= 0;
                });
            },
            maleCount() { return this.filteredData.filter(function(i) { return i.sex == 0; }).length; },
            femaleCount() { return this.filteredData.filter(function(i) { return i.sex == 1; }).length; },
            totalPages() { return Math.max(1, Math.ceil(this.total / this.pageSize)); }
        },
        methods: {
            load() {
                var that = this;
                axios.post("Student/select?currenPage=" + this.currentPage + "&pageSize=" + this.pageSize)
                    .then(function(res) {
                        if (res.data.code === 2000) {
                            that.tableData = res.data.data.list;
                            that.total = res.data.data.total;
                        }
                    });
            },
            handleSizeChange(v) { this.pageSize = v; this.currentPage = 1; this.load(); },
            handleCurrentChange(v) { this.currentPage = v; this.load(); },
            del(id) {
                var that = this;
                ElementPlus.ElMessageBox.confirm('确定删除该员工吗？', '提示', {
                    confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
                }).then(function() {
                    axios.post("Student/delete", Qs.stringify({ method: "delete", id: id }))
                        .then(function(res) {
                            if (res.data.code === 2000) {
                                ElementPlus.ElMessage({ message: '删除成功', type: 'success' });
                                that.load();
                            } else {
                                ElementPlus.ElMessage({ message: res.data.msg || '删除失败', type: 'error' });
                            }
                        });
                }).catch(function() {});
            },
            doAdd() {
                var that = this;
                this.$refs.addForm.validate(function(valid) {
                    if (valid) {
                        axios.post("Student/insert", Qs.stringify(that.addform)).then(function(res) {
                            if (res.data.code === 2000) {
                                ElementPlus.ElMessage({ message: '添加成功', type: 'success' });
                                that.addform = { sex: 0 };
                                that.addDialogVisible = false;
                                that.load();
                            } else {
                                ElementPlus.ElMessage({ message: res.data.msg || '添加失败', type: 'error' });
                            }
                        });
                    }
                });
            },
            edit(row) { this.editDialogVisible = true; this.editform = JSON.parse(JSON.stringify(row)); },
            doEdit() {
                var that = this;
                this.$refs.editForm.validate(function(valid) {
                    if (valid) {
                        axios.post("Student/update", Qs.stringify(that.editform)).then(function(res) {
                            if (res.data.code === 2000) {
                                ElementPlus.ElMessage({ message: '修改成功', type: 'success' });
                                that.editDialogVisible = false;
                                that.load();
                            } else {
                                ElementPlus.ElMessage({ message: res.data.msg || '修改失败', type: 'error' });
                            }
                        });
                    }
                });
            },
            quit() {
                var that = this;
                ElementPlus.ElMessageBox.confirm('确定退出登录吗？', '提示', {
                    confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
                }).then(function() {
                    axios.post("User/quit").then(function() { location.href = "login.html"; });
                }).catch(function() {});
            }
        },
        mounted() { this.load(); }
    });
    app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
    for (const [key, comp] of Object.entries(ElementPlusIconsVue)) {
        app.component(key, comp);
    }
    app.mount('#app');
</script>
</body>
</html>
