<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理系统 - 登录</title>
    <link rel="stylesheet" href="css/font-awesome.min.css"/>
    <script src="js/vue3.js"></script>
    <script src="js/qs.min.js"></script>
    <script src="js/axios.min.js"></script>
    <link rel="stylesheet" href="js/index.css">
    <script src="js/index.full.js"></script>
    <script src="js/index.iife.min.js"></script>
    <script src="js/zh-cn.js"></script>
    <style>
        /* 字体规范: 11px(提示) 12px(正文) 13px(按钮) 14px(小标题) 16px(大标题) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%; width: 100%; overflow: hidden;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            font-size: 12px;
        }
        .page {
            width: 100%; height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .page::before {
            content: ''; position: absolute; inset: 0;
            background-image:
                    radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.08) 0%, transparent 60%),
                    radial-gradient(ellipse at 70% 80%, rgba(255,255,255,0.06) 0%, transparent 60%);
        }
        .card {
            width: 380px; background: #fff;
            border-radius: 10px; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative; z-index: 1;
        }
        .card-head {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            padding: 30px 24px 36px; text-align: center;
        }
        .card-head .logo {
            width: 50px; height: 50px; margin: 0 auto 10px;
            background: rgba(255,255,255,0.2); border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .card-head .logo i { font-size: 24px; color: #fff; }
        .card-head h1 {
            font-size: 16px; color: #fff; font-weight: 600;
            letter-spacing: 1px;
        }
        .card-head p { font-size: 11px; color: rgba(255,255,255,0.8); margin-top: 4px; }
        .card-body { padding: 30px 28px 24px; }
        .field { margin-bottom: 16px; }
        .field label {
            display: block; font-size: 12px; color: #606266;
            margin-bottom: 6px; font-weight: 500;
        }
        .field .ip-wrap {
            position: relative; display: flex; align-items: center;
        }
        .field .ip-wrap i {
            position: absolute; left: 10px; font-size: 13px; color: #c0c4cc;
        }
        .field input {
            width: 100%; height: 36px;
            padding: 0 12px 0 32px;
            border: 1px solid #dcdfe6; border-radius: 6px;
            font-size: 12px; color: #303133;
            background: #f5f7fa; transition: all 0.2s;
        }
        .field input:focus {
            outline: none; border-color: #2a5298;
            background: #fff; box-shadow: 0 0 0 2px rgba(42,82,152,0.1);
        }
        .field .err { font-size: 11px; color: #f56c6c; margin-top: 4px; min-height: 14px; }
        .btn-login {
            width: 100%; height: 38px; margin-top: 16px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border: none; border-radius: 6px; color: #fff;
            font-size: 13px; font-weight: 500; letter-spacing: 1px;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 6px; transition: all 0.2s;
        }
        .btn-login:hover { box-shadow: 0 6px 18px rgba(30,60,114,0.4); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .tips { text-align: center; font-size: 11px; color: #909399; margin-top: 14px; }
    </style>
</head>
<body>
<div class="page" id="app">
    <div class="card">
        <div class="card-head">
            <div class="logo"><i class="fa fa-users"></i></div>
            <h1>员工管理系统</h1>
            <p>Employee Management System</p>
        </div>
        <div class="card-body">
            <form @submit.prevent="submitForm">
                <div class="field">
                    <label>账号</label>
                    <div class="ip-wrap">
                        <i class="fa fa-user"></i>
                        <input type="text" v-model="loginForm.username" placeholder="请输入账号">
                    </div>
                    <div class="err">{{ errors.username }}</div>
                </div>
                <div class="field">
                    <label>密码</label>
                    <div class="ip-wrap">
                        <i class="fa fa-lock"></i>
                        <input type="password" v-model="loginForm.password" placeholder="请输入密码">
                    </div>
                    <div class="err">{{ errors.password }}</div>
                </div>
                <button type="submit" class="btn-login" :disabled="loading">
                    <i class="fa fa-spinner fa-spin" v-if="loading"></i>
                    <span>{{ loading ? '登录中...' : '登 录' }}</span>
                </button>
            </form>
            <div class="tips">建议使用 Chrome 或 Firefox 浏览器</div>
        </div>
    </div>
</div>

<script>
    const app = Vue.createApp({
        data() {
            return {
                loginForm: { username: '', password: '' },
                errors: { username: '', password: '' },
                loading: false
            }
        },
        methods: {
            submitForm() {
                if (!this.loginForm.username) {
                    this.errors.username = '请输入账号';
                    return;
                }
                if (!this.loginForm.password) {
                    this.errors.password = '请输入密码';
                    return;
                }
                const that = this;
                this.loading = true;
                axios.post("User/login", Qs.stringify(this.loginForm)).then(function (result) {
                    that.loading = false;
                    if (result.data.code === 2000) {
                        ElementPlus.ElMessage({ message: '登录成功', type: 'success', duration: 1200 });
                        setTimeout(() => { location.href = "home.html"; }, 600);
                    } else {
                        ElementPlus.ElMessage({ message: result.data.msg || '登录失败', type: 'error' });
                    }
                }).catch(function () {
                    that.loading = false;
                    ElementPlus.ElMessage({ message: '网络错误', type: 'error' });
                });
            }
        }
    });
    app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
        app.component(key, component);
    }
    app.mount('#app');
</script>
</body>
</html>
